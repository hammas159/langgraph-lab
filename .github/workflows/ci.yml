name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check shared projects tests scripts
          uv run ruff format --check shared projects tests

      - name: Tests
        # CI has no GPU and no ollama, so `live` is deselected. Graph construction, scoring
        # and the derived RunResult properties are pure functions and are covered here.
        run: uv run pytest -q -m "not live"
